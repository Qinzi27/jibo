name: Build Jibo Android APK
# Import into your own repository and manually run this workflow.
# It does not publish a release or submit to an app store.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build offline web bundle
        run: python3 scripts/build_web.py
      - name: Unit tests
        run: node --test tests/core.test.cjs
      - name: Runtime packaging security tests
        run: python3 tests/packaging_security_test.py
      - name: Local file and WebView boundary tests
        run: python3 android/tests/run_local_security_tests.py
      - name: Updater trust boundary tests
        run: python3 android/tests/run_tests.py
      - name: Require the same private signing key for every build
        env:
          LEAN_KEYSTORE_BASE64: ${{ secrets.LEAN_KEYSTORE_BASE64 }}
          LEAN_KEY_ALIAS: ${{ secrets.LEAN_KEY_ALIAS }}
          LEAN_STORE_PASS: ${{ secrets.LEAN_STORE_PASS }}
          LEAN_KEY_PASS: ${{ secrets.LEAN_KEY_PASS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ('LEAN_KEYSTORE_BASE64', 'LEAN_KEY_ALIAS', 'LEAN_STORE_PASS', 'LEAN_KEY_PASS')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configure all four LEAN signing secrets before building. Never generate a new key per run.')
          key = Path(os.environ['RUNNER_TEMP']) / 'jibo-signing.keystore'
          descriptor = os.open(key, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'wb') as output:
              output.write(base64.b64decode(os.environ['LEAN_KEYSTORE_BASE64'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('LEAN_KEYSTORE_PATH=' + str(key) + '\n')
          PY
      - name: Build and verify signed APK
        env:
          LEAN_KEY_ALIAS: ${{ secrets.LEAN_KEY_ALIAS }}
          LEAN_STORE_PASS: ${{ secrets.LEAN_STORE_PASS }}
          LEAN_KEY_PASS: ${{ secrets.LEAN_KEY_PASS }}
        run: python3 scripts/build_android.py
      - name: Collect only the current verified release
        run: |
          python3 - <<'PYTHON'
          import json, os, shutil
          from pathlib import Path
          metadata = Path('dist/jibo-update.json')
          version = json.loads(metadata.read_text())['versionName']
          filename = 'jibo-v' + version + '.apk'
          if Path(filename).name != filename:
              raise SystemExit('Invalid release filename')
          output = Path(os.environ['RUNNER_TEMP']) / 'jibo-release'
          output.mkdir()
          for path in (Path('dist') / filename, Path('dist') / (filename + '.sha256'), metadata):
              shutil.copy2(path, output / path.name)
          PYTHON
      - name: Store build artifact (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jibo-android
          path: ${{ runner.temp }}/jibo-release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/jibo-signing.keystore"
